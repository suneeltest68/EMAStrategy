# Set root logger level to WARN and its only appender to stdout
log4j.rootLogger=WARN, stdout

# stdout is set to be a ConsoleAppender.
log4j.appender.stdout=org.apache.log4j.ConsoleAppender

# stdout uses PatternLayout.
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}: %m%n

# Suppress harmless Apache HttpClient cookie validation warnings from Cloudflare (__cf_bm)
log4j.logger.org.apache.http.client.protocol.ResponseProcessCookies=ERROR
log4j.logger.org.apache.http.client.protocol=ERROR
