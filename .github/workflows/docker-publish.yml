name: Build and Push Docker Image

on:
  push:
    branches:
      - OneMinForLive
      - main
      - master
      - sensex-nifty-option-selling-algo
      - feature/iron-fly
      - morning-strategy
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker tag
        id: vars
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          TAG="${BRANCH//\//-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/cww-trading-bot:${{ steps.vars.outputs.tag }}
